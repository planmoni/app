<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planmoni Disbursement Request Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      background: transparent;
    }
    
    .widget-container {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      min-width: 300px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    
    button {
      width: 100%;
      padding: 12px;
      background: #1E3A8A;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    
    button:hover {
      background: #1e40af;
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .error {
      color: #d32f2f;
      font-size: 12px;
      margin-top: 8px;
    }
    
    .success {
      color: #2e7d32;
      font-size: 12px;
      margin-top: 8px;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="widget-root" class="widget-container">
    <form id="disbursement-form">
      <div class="form-group">
        <label>Amount (NGN)</label>
        <input type="number" id="amount" required min="1" step="0.01" />
      </div>
      
      <div class="form-group">
        <label>Recipient Account Number</label>
        <input type="text" id="account_number" required />
      </div>
      
      <div class="form-group">
        <label>Bank Code</label>
        <input type="text" id="bank_code" required />
      </div>
      
      <div class="form-group">
        <label>Account Name</label>
        <input type="text" id="account_name" required />
      </div>
      
      <div class="form-group">
        <label>Purpose (Optional)</label>
        <textarea id="purpose" rows="2"></textarea>
      </div>
      
      <button type="submit" id="submit-btn">Request Disbursement</button>
      <div id="message"></div>
    </form>
  </div>

  <script>
    // Widget configuration from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const config = {
      partner_id: urlParams.get('partner_id'),
      wallet_id: urlParams.get('wallet_id'),
      external_user_id: urlParams.get('external_user_id'),
      api_key: urlParams.get('api_key'),
      default_amount: urlParams.get('default_amount'),
    };

    const API_BASE = window.location.origin;

    // Set default amount if provided
    if (config.default_amount) {
      document.getElementById('amount').value = config.default_amount;
    }

    // Handle form submission
    document.getElementById('disbursement-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      const messageDiv = document.getElementById('message');
      submitBtn.disabled = true;
      messageDiv.innerHTML = '<div class="loading">Processing...</div>';

      try {
        const response = await fetch(`${API_BASE}/api/v1/disbursements`, {
          method: 'POST',
          headers: {
            'X-API-Key': config.api_key,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            wallet_id: config.wallet_id,
            amount: parseFloat(document.getElementById('amount').value),
            recipient_account_number: document.getElementById('account_number').value,
            recipient_bank_code: document.getElementById('bank_code').value,
            recipient_account_name: document.getElementById('account_name').value,
            purpose: document.getElementById('purpose').value || null,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Disbursement request failed');
        }

        messageDiv.innerHTML = `<div class="success">Disbursement requested successfully! Status: ${data.disbursement.status}</div>`;
        
        // Notify parent
        if (window.parent !== window) {
          window.parent.postMessage({
            source: 'planmoni-widget',
            type: 'disbursement_requested',
            data: data.disbursement,
            timestamp: new Date().toISOString(),
          }, '*');
        }

        // Reset form after delay
        setTimeout(() => {
          document.getElementById('disbursement-form').reset();
          messageDiv.innerHTML = '';
        }, 3000);
      } catch (error) {
        messageDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
