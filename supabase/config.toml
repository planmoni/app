# Called from app after signup (user JWT); creates Bunce customer for engagement
[functions.create-bunce-customer]
verify_jwt = true

[functions.sync-bunce-device]
verify_jwt = true

# Cron + DB triggers (service role JWT)
[functions.sync-bunce-devices]
verify_jwt = true

[functions.trigger-bunce-event]
verify_jwt = true

[functions.sync-bunce-attributes]
verify_jwt = true

# Mono webhook: called by Mono servers without a JWT; auth is via MONO_WEBHOOK_SECRET signature
[functions.mono-webhook]
verify_jwt = false

# Verify-and-credit: called from the app with the user's session JWT
[functions.mono-directpay-verify-and-credit]
verify_jwt = true

# Retry pending Mono DirectPay: called by cron or manually with service role; no user JWT
[functions.retry-pending-mono-directpay]
verify_jwt = false

# Hourly pg_cron + service role JWT (see NOTIFICATIONS_RUNBOOK)
[functions.process-lifecycle-retargeting]
verify_jwt = true

[functions.reconcile-payout-plans]
verify_jwt = true

[functions.send-push-notification]
enabled = true
verify_jwt = true
import_map = "./functions/send-push-notification/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-push-notification/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-push-notification/*.html" ]
